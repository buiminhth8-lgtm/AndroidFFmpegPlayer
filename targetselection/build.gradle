plugins {
    id 'com.android.library'
}

// 模块边界（硬约束）：
//   :targetselection  不依赖 :ffmpegplayer
//   :ffmpegplayer     不依赖 :targetselection
//   app 层负责把播放器实现与 targetselection 组装起来
// 因此这里只声明 Android framework 与测试依赖，不引入 OpenCV / ML Kit / TFLite，
// 也不接入任何播放器 SDK。日后由 app 层实现 VideoFrameSource / TargetProvider 并注入。
android {
    namespace 'com.example.motro.targetselection'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // 核心 API 是纯逻辑 + 单一 Bitmap 载体，零第三方运行时依赖。
    testImplementation 'junit:junit:4.13.2'

    // 真机冒烟测试：PixelCopy / TextureView.getBitmap 这两条平台路径无法在 JVM 里覆盖，
    // 需要在设备上跑。以下依赖只参与测试 APK 的构建，不会进入发布的 AAR。
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}

// 真实采样帧的离线验证是**按需**跑的：样本体积大且不进版本库，所以默认不设这两个属性，
// BlueMaskSampleSmokeTest 会自动跳过（Assume）。需要时显式传入：
//   ./gradlew :targetselection:testDebugUnitTest --tests '*BlueMaskSampleSmokeTest*' \
//       -Dtargetselection.sampleDir=artifacts/roi_blue_mask_samples
//
// Slice 5 的样本用**独立**的属性名（boxSampleDir/boxSampleReport），与 Slice 4 的分开。
// 两者共用同一个属性名的话，用 Slice 5 的目录去跑全量测试会让 Slice 4 的 smoke test
// 撞上它不认识的 expect 值（HIT_BOX / MISS / NO_BOX）而报错 —— 那是配置问题，
// 不是真实缺陷，不该以失败的形式冒出来。
//
// Slice 7（标签区域）同样独立（labelSampleDir/labelSampleReport）。它的目录参数支持
// 逗号分隔的多个目录，因为样本分两族（合成 + 真实帧），一次跑完才有完整的验收面：
//   ./gradlew :targetselection:testDebugUnitTest --tests '*LabelSampleSmokeTest*' \
//       -Dtargetselection.labelSampleDir=artifacts/target_label_samples,artifacts/target_label_real_samples
tasks.withType(Test).configureEach {
    systemProperty 'targetselection.sampleDir', System.getProperty('targetselection.sampleDir', '')
    systemProperty 'targetselection.sampleReport', System.getProperty('targetselection.sampleReport', '')
    systemProperty 'targetselection.boxSampleDir', System.getProperty('targetselection.boxSampleDir', '')
    systemProperty 'targetselection.boxSampleReport',
            System.getProperty('targetselection.boxSampleReport', '')
    systemProperty 'targetselection.labelSampleDir',
            System.getProperty('targetselection.labelSampleDir', '')
    systemProperty 'targetselection.labelSampleReport',
            System.getProperty('targetselection.labelSampleReport', '')
}
